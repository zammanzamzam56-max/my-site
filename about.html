<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About | SaleCompass</title>
  <link rel="stylesheet" href="assets/styles.css" />

  <style>
    /* ===== HERO BACKGROUND ===== */
    .about-hero {
      position: relative;
      background: url("assets/img/about-bg.png") center/cover no-repeat;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff;
    }

    /* Dark navy overlay */
    .about-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(10, 25, 54, 0.55); 
    }

    .about-hero .container {
      position: relative;
      z-index: 2;
    }

    .about-hero h1 {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    /* ⭐ CHANGE APPLIED HERE — NEW TEXT COLOUR ⭐ */
    .about-hero .hero-subtext {
      font-size: 20px;
      font-weight: 400;
      max-width: 760px;
      margin: 0 auto;
      line-height: 1.6;
      opacity: 0.95;

      color: #ffcc00 !important;   /* CHANGE THIS COLOUR ONLY */
    }

    /* ===== CONTENT SECTIONS ===== */
    .about-section, .mv-section, .values-section, .timeline-section, .why-section {
      padding: 60px 0;
      background: #f9fafb;
    }

    .about-card, .mv-card, .value-card, .why-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.07);
    }

    .about-card h2 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #0a1a3a;
    }

    .about-card p {
      color: #3a3a3a;
      font-size: 17px;
      line-height: 1.75;
      margin-bottom: 14px;
    }

    /* ===== TITLES ===== */
    .center-title {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      color: #0a1a3a;
      margin-bottom: 30px;
    }

    .mv-grid, .values-grid, .why-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
    }

    .mv-card h3, .value-card h4, .why-card h4 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #0a1a3a;
    }

    .mv-card p, .value-card p, .why-card p {
      color: #555;
      line-height: 1.65;
    }

    /* ===== TIMELINE ===== */
    .timeline {
      border-left: 4px solid #0a1a3a;
      margin-top: 30px;
      padding-left: 28px;
    }

    .timeline-item {
      margin-bottom: 24px;
      position: relative;
    }

    .timeline-item::before {
      content: "";
      width: 16px;
      height: 16px;
      background: #0a1a3a;
      border-radius: 50%;
      position: absolute;
      left: -38px;
      top: 6px;
    }

    .timeline-year {
      font-size: 18px;
      font-weight: 700;
      color: #0a1a3a;
    }

    .timeline-item p {
      margin-top: 6px;
      color: #444;
    }

    /* ===== ANIMATIONS ===== */
    .fade-up {
      opacity: 0;
      transform: translateY(40px);
      transition: 0.8s ease-out;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="index.html">
        <img src="assets/img/logo.svg" alt="SaleCompass Logo">
      </a>

      <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>

      <nav class="menu">
        <a href="index.html">Home</a>
        <a class="active" href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="case-studies.html">Case Studies</a>
        <a href="research.html">R&amp;D</a>
        <a href="success-stories.html">Success Stories</a>
        <a class="btn primary" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- HERO -->
    <section class="about-hero fade-up">
      <div class="container">
        <h1>About SaleCompass</h1>
        <p class="hero-subtext">
          A modern AI-powered marketing intelligence platform helping SMEs understand  
          what truly drives results across every online and offline touchpoint.
        </p>
      </div>
    </section>

    <!-- REST OF YOUR PAGE CONTENT (unchanged) -->
    <!-- ... remains exactly as you provided ... -->

  </main>

  <!-- FOOTER (unchanged) -->
  <footer class="site-footer fade-up">
    <!-- footer content same -->
  </footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.querySelector(".menu-toggle");
  const menu = document.querySelector(".menu");

  if (btn && menu) {
    btn.addEventListener("click", () => {
      const expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", !expanded);
      menu.classList.toggle("open");
    });
  }

  // Footer Year
  const y = document.getElementById("year");
  if (y) y.textContent = new Date().getFullYear();

  // Animations
  const animated = document.querySelectorAll(".fade-up");
  const animateOnScroll = () => {
    animated.forEach(el => {
      if (el.getBoundingClientRect().top < window.innerHeight - 80) {
        el.classList.add("visible");
      }
    });
  };

  window.addEventListener("scroll", animateOnScroll);
  animateOnScroll();
});
</script>

</body>
</html>
